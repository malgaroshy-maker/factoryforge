# OpenPLC Runtime v3 -- Modbus master ("Slave Devices") configuration for the
# FactoryForge sorting scene.
#
# The OpenPLC web UI writes this file for you when you add a Slave Device; it
# lives at webserver/mbconfig.cfg and the runtime reads it from its own working
# directory (webserver/core/) at startup. It is here so the example can be run
# without the web UI at all -- copy it to webserver/core/mbconfig.cfg.
#
# The sizes below are the sorting scene's ten tags as the sidecar maps them.
# Re-read them off `python -m factoryforge_sidecar connect --driver modbus-tcp`
# if you change the scene: addresses are stable across edits, but a new tag is
# a new address and the size has to grow to reach it.
#
#   4 discrete inputs  1x0..1x3  pusher.extended, pusher.retracted,
#                                sensor_high.detect, sensor_low.detect
#   4 coils            0x0..0x3  conveyor.rotate, emitter.emit,
#                                pusher.extend, stack_light.green
#   4 input registers  3x0..3x3  counter.short (3x0+3x1),
#                                counter.tall  (3x2+3x3)
#
# Four input registers for two counters. An Int tag is 32 bits and takes two
# registers; see the note at the top of Sorting.st.

Num_Devices = "1"

# 50 ms, not OpenPLC's default 100. The pusher's catch window has 0.3 s of
# slack and the polling period is paid twice -- once for the sensor to reach
# the PLC, once for the coil to reach the simulator.
Polling_Period = "50"
Timeout = "1000"

device0.name = "FactoryForge"
device0.slave_id = "1"
device0.protocol = "TCP"
device0.address = "127.0.0.1"
device0.IP_Port = "5502"

device0.Discrete_Inputs_Start = "0"
device0.Discrete_Inputs_Size = "4"

device0.Coils_Start = "0"
device0.Coils_Size = "4"

device0.Input_Registers_Start = "0"
device0.Input_Registers_Size = "4"

device0.Holding_Registers_Read_Start = "0"
device0.Holding_Registers_Read_Size = "0"

device0.Holding_Registers_Start = "0"
device0.Holding_Registers_Size = "0"
