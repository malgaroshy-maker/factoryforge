[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
markers =
    graded: every test in tests/test_grade.py, the headless grader (applied by tests/conftest.py). Slow; CI runs them in a job of their own.
filterwarnings =
    error::DeprecationWarning:factoryforge_sidecar.*
