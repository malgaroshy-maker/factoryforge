name: test-plan

# Runs the checks tools/test_plan.py already sequences: the C# build, the
# Python suite, the engine self-tests, the determinism contract, and an
# exercise for every scene in engine/templates/manifest.json. Written as
# FF-28 (docs/history/FIX_PLAN.md); docs/TEST_PLAN.md says what each check is
# for.
#
# Deliberately --only A,B,C,E,H. H (tools/try_scene.py against every shipped
# scene) needs no display -- the spike behind UX-10 proved templates simulate
# headless -- so it belongs beside A/C/E rather than behind --gui. D needs a
# display. F (the sidecar-seam checks) and G (robustness, including the
# engine-kill and pause-force regression tests) exercise process lifecycle and
# port timing and have only ever been run on Windows. Bringing them here is
# IP-05 in docs/IMPROVEMENT_PLAN.md: run them on Linux for real rather than
# assume they work.
#
# Two jobs, in parallel. `test-plan` is everything above except the graded
# tests; `grader` is the graded tests alone (IP-04). Each should be a required
# check -- that is a branch-protection setting, not something this file sets.

on:
  push:
    branches: [master]
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  # The fast signal: build, bus, drivers, self-tests, determinism, scenes.
  # Everything except the graded tests, which have a job of their own below
  # so this one does not wait ~30 minutes behind them (IP-04). The ceiling is
  # about twice what this job took before the grader existed (~16 min).
  test-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux

      - name: Download Godot ${{ env.GODOT_VERSION }} (.NET / mono)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          cd ~/godot
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip
          rm godot.zip

      - name: Point $GODOT at the extracted binary
        run: |
          GODOT_BIN=$(find ~/godot -maxdepth 2 -type f -name "Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64")
          if [ -z "$GODOT_BIN" ]; then
            echo "could not find the Godot binary under ~/godot -- archive layout changed" >&2
            find ~/godot -maxdepth 3 >&2
            exit 1
          fi
          chmod +x "$GODOT_BIN"
          echo "GODOT=$GODOT_BIN" >> "$GITHUB_ENV"

      # `siemens` as well as `dev`: without snap7 installed,
      # test_the_fake_agrees_with_real_snap7 hits its importorskip and the
      # whole Siemens offset suite silently measures FakeUtil against
      # itself. That check exists to catch the fake drifting from the real
      # library, and it only earns its keep where the real one is present.
      # snap7 is a pure pip install; it needs no Siemens software.
      - name: Install the sidecar (with test extras)
        run: pip install -e "sidecar[dev,siemens]"

      - name: Run the test plan (A, B without the graded tests, C, E, H)
        run: python tools/test_plan.py --only A,B,C,E,H --pytest-marker "not graded"

  # The graded tests: tests/test_grade.py, marked `graded` by tests/conftest.py.
  # They run the headless grader against harness/engine_stub.py over a real
  # tag bus -- Python end to end, so this job installs neither Godot nor .NET.
  # Run through test_plan.py rather than bare pytest so a failure is reported
  # the way B1 reports it: counted and named from pytest's JUnit XML.
  # The graded half of B took 31 minutes of run 35698579275.
  grader:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the sidecar (with test extras)
        run: pip install -e "sidecar[dev,siemens]"

      - name: Run the graded tests (B, -m graded)
        run: python tools/test_plan.py --only B --pytest-marker graded
