; FactoryForge export presets.
;
; Godot fills in any option left out here with its defaults, so this file is
; deliberately short: it defines *which* targets exist and where they land, and
; leaves the rest to the editor.
;
; Requires the export templates for this exact Godot version (Editor > Manage
; Export Templates). A .NET/mono build also needs the .NET SDK on the machine
; doing the export — see docs/PACKAGING.md.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="*.md, .godot/*"
export_path="../dist/windows/FactoryForge.exe"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

binary_format/embed_pck=true
application/product_name="FactoryForge"
application/file_description="Open 3D factory simulator for learning PLC programming"
application/company_name="Mahamed Algaroshy"
application/copyright="Copyright (c) Mahamed Algaroshy"
application/icon="res://icon.ico"
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false

[preset.1]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="*.md, .godot/*"
export_path="../dist/linux/FactoryForge.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

binary_format/embed_pck=true
application/icon="res://icon.png"
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false
